image: python:slim

variables:
  # Change pip's cache directory to be inside the project directory since we can
  # only cache local items.
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # make firefox run without a display
  MOZ_HEADLESS: "1"

# https://pip.pypa.io/en/stable/topics/caching/
cache:
  paths:
    - .cache/pip


test:
  before_script:
    # install firefox
    # TODO temporarily uncommented
    # - apt-get update -y && apt-get install -y firefox-esr
    - python --version ; pip --version  # For debugging
    - pip install virtualenv
    - virtualenv .venv
    - source .venv/bin/activate

  script:
    - pip install -r requirements.txt
    - pip install selenium

    # unit tests
    - python src/manage.py test lists accounts
    # (if those pass) all tests, incl. functional. yes we need that cd.
    # TODO temporarily uncommented fix
    # - cd src && python manage.py test

build:
  image: docker:git
  # build and test against docker image
  script:
    - docker build -t superlists .
    - docker run
      -p 8888:8888
      --mount type=bind,source=./src/db.sqlite3,target=/src/db.sqlite3
      -e DJANGO_SECRET_KEY=sekrit
      -e DJANGO_ALLOWED_HOST=localhost
      -e EMAIL_PASSWORD
      -t superlists
    # - TEST_SERVER=localhost:8888 python src/manage.py test functional_tests

